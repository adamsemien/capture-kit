<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>capture-kit — result</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <header>
      <div class="wordmark">
        <span class="mark"></span>
        <span class="label">capture-kit</span>
      </div>
      <h1 id="headline"></h1>
      <div id="meta" class="chips"></div>
      <div class="actions">
        <button id="copy-for-ai" class="primary">Copy for AI</button>
        <button id="copy-markdown" hidden>Copy markdown</button>
        <button id="show-in-finder" class="quiet">Show in Finder</button>
        <span class="spacer"></span>
        <div id="zoom" class="segmented">
          <button id="view-fit" class="on">Fit</button>
          <button id="view-full">100%</button>
        </div>
        <span id="status" class="status"></span>
      </div>
    </header>
    <main>
      <div id="warnings" class="warnings"></div>
      <div id="images" class="images"></div>
      <section id="markdown-pane" class="markdown-pane" hidden>
        <h2 class="label">The report</h2>
        <pre id="markdown"></pre>
      </section>
    </main>
    <script src="result.js"></script>
  </body>
</html>
