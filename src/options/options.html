<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>capture-kit settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>capture-kit settings</h1>
      <label class="field">
        <span>Segment size cap (px)</span>
        <input id="segment-size" type="number" min="1024" max="16384" step="256" />
        <small>Pages larger than this per dimension are captured in segments and joined. Default 8192.</small>
      </label>
      <label class="field checkbox">
        <input id="include-logs" type="checkbox" />
        <span>Include log-level console entries in reports (errors and warnings are always included)</span>
      </label>
      <label class="field checkbox">
        <input id="open-result" type="checkbox" />
        <span>Open result after capture</span>
        <small>Shows the captured image(s), the report markdown, and Show in Finder in a new tab so you can see what you got without opening files.</small>
      </label>
      <label class="field checkbox">
        <input id="maintain-latest" type="checkbox" />
        <span>Maintain latest.* pointer files</span>
        <small>After every report, latest.md and latest.jpg/png in Downloads/capture-kit are overwritten with the newest capture, so an AI coding agent can be told once to read ~/Downloads/capture-kit/latest.md and always get the current one. These writes are hidden from the download shelf and history.</small>
      </label>
      <div class="field">
        <span>Report image format</span>
        <label class="radio">
          <input type="radio" name="bundle-format" value="jpeg" />
          JPEG — smaller files (default)
        </label>
        <label class="radio">
          <input type="radio" name="bundle-format" value="png" />
          PNG — lossless
        </label>
        <small>"Image only" saves JPEG unless you tick PNG next to it in the popup.</small>
      </div>
      <p id="status" class="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
