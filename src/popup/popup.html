<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="wordmark">
        <span class="mark"></span>
        <span class="label">capture-kit</span>
      </div>

      <div class="buttons">
        <button id="capture-bundle" class="primary hero">
          <span>Capture + Report</span>
          <span class="shortcut">⌘⇧9</span>
        </button>

        <div class="row">
          <button id="capture-page">Image only</button>
          <label class="png-chip" title="Lossless, but far larger — a tall page can run to tens of megabytes.">
            <input id="image-only-png" type="checkbox" />
            <span>PNG</span>
          </label>
        </div>

        <!--
          Not .quiet: that class zeroes the border and background, and these
          three rendered as bare text with no affordance — people did not read
          them as clickable. They now use the same bordered treatment as
          "Image only". The hero button keeps .primary, so the hierarchy is
          still primary > secondary rather than flat.
        -->
        <button id="record-clip" title="Records the tab for a few seconds; the frames that changed go on one sheet for your assistant.">
          <span>Record clip</span>
          <span class="shortcut">⌘⇧8</span>
        </button>
        <button id="capture-session">Capture session (multiple tabs)</button>
        <button id="copy-last">Copy last report</button>
        <button id="responsive-sweep">Responsive sweep (3 widths)</button>
      </div>

      <p id="status" class="status"></p>
      <p id="stats" class="stats"><span class="dot"></span><span id="stats-text"></span></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
