# Standard CI for every Adam Semien repo.
# The job name `verify` is a contract: the main-gate ruleset requires a check
# called exactly `verify`. Rename the job and the gate stops matching.
# Add steps freely; keep the job name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: node build.mjs
